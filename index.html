<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>NachoZzwiki</title>
  <link rel="icon" href="_media/a4c8794152ed7daeb21fb0348324af98.jpg" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
        loadSidebar: true,
        name: 'NachoZz',
        mergeNavbar: true,
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  
<script type="module">
  import { createWidget } from 'https://esm.sh/l2d-widget@0.0.2';

  createWidget({
    model: {
      path: 'NOIR/noir.model3.json',
    },
    position: 'bottom-right',
    size: 300,
    menus: {
      extraItems: [
        {
          icon: 'mdi:backup-restore',
          label: '还原表情',
          onClick: (widget) => widget.l2d.setExpression('default')
        },
        {
          icon: 'mdi:emoticon-happy-outline',
          label: '闭眼',
          onClick: (widget) => widget.l2d.setExpression('eyeclose')
        },
        {
          icon: 'mdi:emoticon-cry-outline',
          label: '眼泪',
          onClick: (widget) => widget.l2d.setExpression('tears')
        },
        {
          icon: 'mdi:invert-colors',
          label: '变白',
          onClick: (widget) => widget.l2d.setExpression('white')
        },
        {
          icon: 'mdi:emoticon-confused-outline',
          label: '圈圈眼',
          onClick: (widget) => widget.l2d.setExpression('quanquan')
        }
      ]
    }
  });
</script>

</body>
</html>
